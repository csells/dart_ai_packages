publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.1.3
  dart_mcp:
    path: ../dart_mcp
  async: ^2.11.0
  dtd: ^4.0.0
  path: ^1.9.0
flutter:
  uses-material-design: false
